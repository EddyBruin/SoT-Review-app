<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Overzicht</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #FED231;
            --primary-hover: #e5bc2c;
            --blue: #60a5fa; 
            --bg: #121212;
            --card-bg: #222222;
            --text: #e0e0e0;
            --text-muted: #9ca3af;
            --border: #333333;
            --column-bg: #1a1a1a;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; color: var(--text); }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #login-screen img { height: 80px; margin-bottom: 20px; }
        #login-screen input { padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border); width: 250px; font-size: 16px; background: #222; color: #fff;}
        .btn { background: var(--primary); color: #121212; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s ease;}
        .btn:hover { background: var(--primary-hover); }

        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-radius: 12px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; border: 1px solid var(--border);}
        .logo-area { display: flex; align-items: center; gap: 15px; font-size: 24px; font-weight: bold; color: var(--primary); }
        .logo-area img { height: 40px; }
        .controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center;}
        .controls input, .controls select { padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; background: #333; color: #fff;}
        
        .stats-bar { background: var(--card-bg); padding: 12px 20px; border-radius: 12px; margin-bottom: 25px; font-size: 14px; display: flex; gap: 20px; overflow-x: auto; white-space: nowrap; border: 1px solid var(--border);}
        
        .board-row { margin-bottom: 40px; }
        .board-row h3 { border-bottom: 2px solid; padding-bottom: 8px; margin-bottom: 20px; font-size: 22px; display: inline-block;}
        .board { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 15px; min-height: 200px;}
        
        .cat-review h3 { color: var(--blue); border-bottom-color: var(--blue); }
        .cat-review .card { border-left-color: var(--blue); }
        .cat-bezit h3 { color: var(--primary); border-bottom-color: var(--primary); }
        .cat-bezit .card { border-left-color: var(--primary); }
        
        .board::-webkit-scrollbar { height: 8px; }
        .board::-webkit-scrollbar-track { background: #222; border-radius: 4px; }
        .board::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .board::-webkit-scrollbar-thumb:hover { background: #777; }

        .column { background: var(--column-bg); min-width: 300px; width: 300px; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; border: 1px solid var(--border);}
        .col-header { font-weight: bold; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center;}
        .task-list { flex-grow: 1; min-height: 100px; display: flex; flex-direction: column; gap: 12px; }
        
        .card { background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); cursor: pointer; position: relative; border-left: 5px solid; transition: all 0.2s ease;}
        .card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.4);}
        .card-title { font-weight: 600; margin-bottom: 6px; font-size: 16px; color: #fff; padding-right: 60px;}
        .card-pub { font-size: 13px; color: var(--text-muted); margin-bottom: 10px;}
        .card-meta { font-size: 12px; display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); margin-top: 8px;}
        
        .bgg-icon { width: 18px; height: 18px; cursor: pointer; transition: filter 0.2s; vertical-align: middle; }
        .bgg-icon:hover { filter: brightness(1.3) drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
        .meeple-icon { width: 12px; height: 12px; vertical-align: middle; margin-right: 4px; filter: brightness(0) invert(1); }
        
        .card-icons { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; align-items: center; font-size: 16px; z-index: 10;}
        .tag { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5);}

        #archive-section { display: none; margin-top: 40px; border-top: 2px dashed var(--border); padding-top: 20px;}
        .archive-card { background: var(--column-bg); padding: 12px; border-radius: 8px; border-left: 4px solid #555; }

        #modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px);}
        .modal { background: var(--card-bg); padding: 30px; border-radius: 16px; width: 90%; max-width: 650px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative;}
        .modal h2 { margin-top: 0; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px;}
        .close-btn { position: absolute; top: 25px; right: 25px; font-size: 24px; cursor: pointer; color: var(--text-muted); transition: color 0.2s;}
        .close-btn:hover { color: #fff; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 5px; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; color: var(--text-muted);}
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #333; color: #fff;}
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(254, 210, 49, 0.2);}
        
        #loading { display: none; text-align: center; padding: 30px; font-weight: bold; color: var(--primary); font-size: 18px;}
        .auto-save-toast { position: fixed; bottom: 20px; right: 20px; background: #10b981; color: white; padding: 10px 20px; border-radius: 8px; display: none; font-weight: bold; z-index: 9999; box-shadow: 0 4px 6px rgba(0,0,0,0.3);}
        
        .version-footer { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 50px; padding-bottom: 20px; letter-spacing: 0.5px;}

        @media (max-width: 768px) {
            .modal-grid { grid-template-columns: 1fr; gap: 15px; }
            .form-group.full-width { grid-column: span 1; }
            header { flex-direction: column; align-items: stretch; }
            .controls { justify-content: space-between; }
            .controls input, .controls select, .controls button { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <img src="logo.png" alt="Spel op Tafel" onerror="this.src='https://www.speloptafel.nl/wp-content/uploads/2023/11/cropped-Logo-SoT.png'">
        <p style="color: var(--text-muted); margin-bottom: 20px;">Review Management Systeem</p>
        <input type="password" id="pwdInput" placeholder="Wachtwoord invoeren..." onkeypress="if(event.key === 'Enter') login()">
        <button class="btn" onclick="login()">Inloggen <i class="fa-solid fa-arrow-right"></i></button>
        <div id="login-error" style="color: #ef4444; margin-top: 15px; font-weight: bold;"></div>
    </div>

    <div id="app-screen" style="display: none;" class="container">
        <header>
            <div class="logo-area">
                <img src="logo.png" alt="Logo" onerror="this.src='https://www.speloptafel.nl/wp-content/uploads/2023/11/cropped-Logo-SoT.png'">
                Review Overzicht
            </div>
            <div class="controls">
                <div style="position: relative;">
                    <i class="fa-solid fa-search" style="position: absolute; left: 10px; top: 12px; color: #888;"></i>
                    <input type="text" id="searchInput" placeholder="Zoek spel..." onkeyup="renderBoard()" style="padding-left: 35px; width: 200px;">
                </div>
                <select id="filterReviewer" onchange="renderBoard()">
                    <option value="">Alle Reviewers</option>
                </select>
                <button class="btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> Nieuw Spel</button>
            </div>
        </header>

        <div class="stats-bar" id="statsBar">Statistieken laden...</div>
        <div id="loading"><i class="fa-solid fa-dice fa-spin"></i> Gegevens ophalen uit Google Sheets...</div>
        
        <div id="kanban-board"></div>
        
        <div id="archive-section">
            <h3 style="color: var(--text-muted); margin-bottom: 15px;"><i class="fa-solid fa-box-archive"></i> Resultaten uit het Overzicht Archief</h3>
            <div id="archive-results" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px;"></div>
        </div>

        <!-- Versie Beheer Footer -->
        <div class="version-footer">
            Review Kanban - Versie 0.9
        </div>
    </div>

    <div id="toast" class="auto-save-toast"><i class="fa-solid fa-check"></i> Opgeslagen!</div>

    <div id="modal-overlay">
        <div class="modal">
            <i class="fa-solid fa-xmark close-btn" onclick="saveAndClose()" title="Opslaan & Sluiten"></i>
            <h2 id="modalTitle"><i class="fa-solid fa-pen-to-square"></i> Spel Bewerken</h2>
            <input type="hidden" id="gId">
            <div class="modal-grid">
                <div class="form-group full-width">
                    <label>Titel Spel *</label>
                    <input type="text" id="gTitel" required placeholder="Naam van het bordspel">
                </div>
                
                <div class="form-group">
                    <label>Uitgever</label>
                    <input type="text" id="gUitgever" placeholder="Bijv. 999 Games">
                </div>
                
                <div class="form-group">
                    <label>Status</label>
                    <select id="gStatus">
                        <optgroup label="Reviewexemplaar">
                            <option value="Aangeboden">Aangeboden</option>
                            <option value="Toegekend">Toegekend</option>
                            <option value="Aangevraagd">Aangevraagd</option>
                            <option value="Opgestuurd">Opgestuurd</option>
                        </optgroup>
                        <optgroup label="In bezit">
                            <option value="Nieuw">Nieuw</option>
                            <option value="Gepland">Gepland</option>
                            <option value="Opgenomen">Opgenomen</option>
                            <option value="Uitgezonden">Uitgezonden</option>
                        </optgroup>
                    </select>
                </div>

                <div class="form-group">
                    <label>Reviewer</label>
                    <select id="gReviewer"><option value="">- Geen -</option></select>
                </div>
                
                <div class="form-group">
                    <label>Podcast Aflevering</label>
                    <select id="gAflevering"><option value="">- Nog niet gepland -</option></select>
                </div>

                <div class="form-group">
                    <label><i class="fa-regular fa-calendar-xmark"></i> Deadline (Optioneel)</label>
                    <input type="date" id="gDeadline">
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-truck"></i> Verwacht op / Track & Trace</label>
                    <input type="text" id="gVerwacht" placeholder="Datum of link">
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-file-lines"></i> Tekst Status</label>
                    <select id="gTekst">
                        <option value="">- Niet af -</option>
                        <option value="Af">Af</option>
                        <option value="Gepubliceerd">Gepubliceerd</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label><img src="BGG.svg" class="meeple-icon" style="width:14px; height:14px;" onerror="this.style.display='none'"> BoardGameGeek Link</label>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="gBgg" placeholder="https://boardgamegeek.com/boardgame/...">
                        <button class="btn" style="padding: 10px 15px;" onclick="autoFetchBGG()" title="Zoek automatisch op BGG op basis van titel">
                            <i class="fa-solid fa-magnifying-glass"></i> Zoek BGG
                        </button>
                    </div>
                </div>
            </div>
            <div style="text-align: right; margin-top: 25px; font-size: 13px; color: var(--text-muted);">
                <i class="fa-solid fa-cloud-arrow-up"></i> Wijzigingen worden automatisch opgeslagen bij het sluiten.
            </div>
        </div>
    </div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzyMLVMBIwLUmLqFkiBn5BWs0b_btiOnj-L63ifH-2wsTGRMSTnt-8rFisFMGSEy-tG/exec"; 
    
    let appData = { games: [], archiveGames: [], reviewers: [], episodes: [], stats: {} };
    let top10Episodes = [];
    
    const categories = {
        "Reviewexemplaar": [
            { id: "Aangeboden", name: "Aangeboden", icon: "fa-handshake" },
            { id: "Toegekend", name: "Toegekend", icon: "fa-user-check" },
            { id: "Aangevraagd", name: "Aangevraagd", icon: "fa-envelope-open-text" },
            { id: "Opgestuurd", name: "Opgestuurd", icon: "fa-box" }
        ],
        "In bezit": [
            { id: "Nieuw", name: "Nieuw / Binnengekomen", icon: "fa-door-open" },
            { id: "Gepland", name: "Gepland voor Podcast", icon: "fa-calendar-check" },
            { id: "Opgenomen", name: "Opgenomen", icon: "fa-microphone" },
            { id: "Uitgezonden", name: "Uitgezonden", icon: "fa-broadcast-tower" }
        ]
    };

    function stringToColor(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
        return `hsl(${Math.abs(hash % 360)}, 70%, 35%)`; 
    }

    // Speciaal voor weergave op het Kanban-bord
    function formatDisplayDate(val) {
        if (!val) return "";
        let datePart = val.split('T')[0];
        let parts = datePart.split('-');
        if (parts.length === 3 && parts[0].length === 4) return `${parts[2]}-${parts[1]}-${parts[0]}`;
        return datePart;
    }

    // Speciaal om de kalender Input het wél te laten begrijpen! (Moet YYYY-MM-DD zijn)
    function formatForDateInput(val) {
        if (!val) return "";
        let datePart = val.split('T')[0];
        let parts = datePart.split('-');
        if (parts.length === 3 && parts[2].length === 4) return `${parts[2]}-${parts[1]}-${parts[0]}`;
        return datePart;
    }

    document.getElementById('modal-overlay').addEventListener('mousedown', function(e) {
        if (e.target === this) saveAndClose();
    });

    window.onload = () => {
        if(localStorage.getItem('sot_token')) { showApp(); fetchData(); }
    };

    setInterval(() => {
        if (document.getElementById('modal-overlay').style.display === 'flex') return;
        fetch(GAS_URL + "?action=getData&token=" + localStorage.getItem('sot_token'))
            .then(res => res.json())
            .then(data => {
                if(data.error) return;
                const newDataStr = JSON.stringify(data.games);
                const oldDataStr = JSON.stringify(appData.games);
                if (newDataStr !== oldDataStr) {
                    appData = data;
                    processDataRules();
                    renderBoard(); 
                }
            }).catch(e => console.log('Silent poll error'));
    }, 15000);

    function login() {
        const pwd = document.getElementById('pwdInput').value;
        const errorDiv = document.getElementById('login-error');
        errorDiv.innerText = "Controleren...";
        fetch(GAS_URL + "?action=login&password=" + encodeURIComponent(pwd))
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('sot_token', data.token);
                    showApp(); fetchData();
                } else errorDiv.innerText = "Onjuist wachtwoord! Probeer het opnieuw.";
            });
    }

    function showApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
    }

    function processDataRules() {
        const today = new Date();
        today.setHours(0,0,0,0);
        top10Episodes = appData.episodes
            .sort((a,b) => new Date(a.date) - new Date(b.date))
            .filter(e => new Date(e.date) >= today)
            .slice(0, 10);
        populateReviewerDropdown();
    }

    function fetchData() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('kanban-board').style.display = 'none';
        
        fetch(GAS_URL + "?action=getData&token=" + localStorage.getItem('sot_token'))
            .then(res => res.json())
            .then(data => {
                if(data.error) { alert("Sessie verlopen."); localStorage.clear(); location.reload(); return; }
                appData = data;
                processDataRules();
                renderBoard();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('kanban-board').style.display = 'block';
            });
    }

    function populateReviewerDropdown() {
        const revSelect = document.getElementById('filterReviewer');
        const modalRev = document.getElementById('gReviewer');
        const currentFilter = revSelect.value;
        
        revSelect.innerHTML = '<option value="">Alle Reviewers</option>';
        modalRev.innerHTML = '<option value="">- Geen -</option>';
        
        appData.reviewers.forEach(r => {
            revSelect.innerHTML += `<option value="${r}">${r}</option>`;
            modalRev.innerHTML += `<option value="${r}">${r}</option>`;
        });
        revSelect.value = currentFilter;
    }

    function populateEpisodeDropdown(currentAflNr) {
        const aflSelect = document.getElementById('gAflevering');
        let optionsHtml = '<option value="">- Nog niet gepland -</option>';
        let foundCurrent = false;

        top10Episodes.forEach(e => {
            optionsHtml += `<option value="${e.nr}">Afl ${e.nr} (${formatDisplayDate(e.date)})</option>`;
            if(e.nr == currentAflNr) foundCurrent = true;
        });

        if (currentAflNr && !foundCurrent) {
            let ep = appData.episodes.find(e => e.nr == currentAflNr);
            if(ep) optionsHtml += `<option value="${ep.nr}">Afl ${ep.nr} (${formatDisplayDate(ep.date)})</option>`;
            else optionsHtml += `<option value="${currentAflNr}">Afl ${currentAflNr}</option>`;
        }
        
        aflSelect.innerHTML = optionsHtml;
        aflSelect.value = currentAflNr || "";
    }

    function renderBoard() {
        const boardContainer = document.getElementById('kanban-board');
        const archiveSection = document.getElementById('archive-section');
        const archiveResults = document.getElementById('archive-results');
        
        boardContainer.innerHTML = '';
        archiveResults.innerHTML = '';
        
        const search = document.getElementById('searchInput').value.toLowerCase();
        const revFilter = document.getElementById('filterReviewer').value;

        Object.keys(categories).forEach(cat => {
            const rowDiv = document.createElement('div');
            const catClass = cat === "Reviewexemplaar" ? "cat-review" : "cat-bezit";
            rowDiv.className = `board-row ${catClass}`;
            
            const catIcon = cat === "Reviewexemplaar" ? "fa-hand-holding-box" : "fa-box-open";
            rowDiv.innerHTML = `<h3><i class="fa-solid ${catIcon}"></i> ${cat}</h3><div class="board" id="board-${cat.replace(/\s/g, '')}"></div>`;
            boardContainer.appendChild(rowDiv);
            
            const catBoard = rowDiv.querySelector('.board');
            
            categories[cat].forEach(col => {
                const colDiv = document.createElement('div');
                colDiv.className = 'column';
                colDiv.innerHTML = `
                    <div class="col-header">
                        <span><i class="fa-solid ${col.icon}"></i> ${col.name}</span>
                        <span class="count-badge" id="count-${col.id}">0</span>
                    </div>
                    <div class="task-list" data-status="${col.id}" id="col-${col.id}"></div>
                `;
                catBoard.appendChild(colDiv);

                Sortable.create(colDiv.querySelector('.task-list'), {
                    group: 'kanban', animation: 150, ghostClass: 'sortable-ghost', filter: ".bgg-icon",
                    onEnd: function (evt) {
                        const itemEl = evt.item;
                        const newStatus = evt.to.getAttribute('data-status');
                        const id = itemEl.getAttribute('data-id');
                        
                        const game = appData.games.find(g => g.id === id);
                        if(game) game.status = newStatus;
                        updateCounts();
                        
                        fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatus', token: localStorage.getItem('sot_token'), id: id, status: newStatus }) });
                    }
                });
            });
        });

        let colCounts = {};
        Object.values(categories).flat().forEach(c => colCounts[c.id] = 0);

        const sortedGames = [...appData.games].sort((a, b) => a.titel.toLowerCase().localeCompare(b.titel.toLowerCase()));

        sortedGames.forEach(game => {
            if (search && !game.titel.toLowerCase().includes(search)) return;
            if (revFilter && game.reviewer !== revFilter) return;

            const list = document.getElementById(`col-${game.status}`);
            if (list) {
                colCounts[game.status]++; 
                
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-id', game.id);
                card.onclick = () => editGame(game.id);
                
                let iconsHtml = '<div class="card-icons">';
                if (game.tekstStatus === 'Af') iconsHtml += `<i class="fa-solid fa-file-lines" style="color: #4ade80;" title="Tekst Af"></i>`;
                if (game.tekstStatus === 'Gepubliceerd') iconsHtml += `<i class="fa-solid fa-globe" style="color: var(--blue);" title="Gepubliceerd"></i>`;
                
                if(game.bggLink) {
                    iconsHtml += `<img src="BGG.svg" class="bgg-icon" title="Bekijk op BoardGameGeek" onclick="event.stopPropagation(); window.open('${game.bggLink}', '_blank');" onerror="this.style.display='none'">`;
                }
                iconsHtml += '</div>';

                let html = iconsHtml + `<div class="card-title">${game.titel}</div>`;
                if(game.uitgever) html += `<div class="card-pub"><i class="fa-regular fa-building"></i> ${game.uitgever}</div>`;
                
                html += `<div class="card-meta">`;
                if(game.reviewer) {
                    const tagColor = stringToColor(game.reviewer);
                    html += `<span class="tag" style="background-color: ${tagColor};"><img src="meeple.png" class="meeple-icon" onerror="this.style.display='none'"> ${game.reviewer}</span>`;
                } else html += `<span></span>`; 
                
                if (game.afleveringNr) html += `<span style="font-weight:bold;"><i class="fa-solid fa-podcast"></i> Afl. ${game.afleveringNr}</span>`;
                else if(game.deadline) html += `<span><i class="fa-regular fa-clock"></i> ${formatDisplayDate(game.deadline)}</span>`;
                html += `</div>`;
                
                card.innerHTML = html;
                list.appendChild(card);
            }
        });

        if (search || revFilter) {
            archiveSection.style.display = 'block';
            let archiveCount = 0;
            const sortedArchive = [...appData.archiveGames].sort((a, b) => a.titel.toLowerCase().localeCompare(b.titel.toLowerCase()));
            
            sortedArchive.forEach(g => {
                if (search && !g.titel.toLowerCase().includes(search)) return;
                if (revFilter && g.reviewer !== revFilter) return;
                archiveCount++;
                
                const tagColor = stringToColor(g.reviewer);
                const query = encodeURIComponent(g.titel.toLowerCase());
                const archiveBggLink = "https://boardgamegeek.com/geeksearch.php?action=search&objecttype=boardgame&q=" + query;

                archiveResults.innerHTML += `
                    <div class="archive-card">
                        <div style="font-weight: bold; color: #fff; margin-bottom: 5px; display:flex; justify-content:space-between;">
                            ${g.titel}
                            <img src="BGG.svg" class="bgg-icon" style="width:16px; height:16px;" onclick="window.open('${archiveBggLink}', '_blank');" title="Zoek op BGG" onerror="this.style.display='none'">
                        </div>
                        <div style="font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between;">
                            <span class="tag" style="background-color: ${tagColor}; font-size: 10px;"><img src="meeple.png" class="meeple-icon" style="width:10px; height:10px;" onerror="this.style.display='none'"> ${g.reviewer}</span>
                            <span><i class="fa-solid fa-podcast"></i> Afl. ${g.afleveringNr || '?'}</span>
                        </div>
                    </div>
                `;
            });
            if (archiveCount === 0) archiveResults.innerHTML = '<span style="color: #666; font-style: italic;">Geen resultaten gevonden in het archief.</span>';
        } else {
            archiveSection.style.display = 'none';
        }

        updateCounts(colCounts);

        let statsHtml = `<strong><i class="fa-solid fa-chart-pie"></i> Totaal aantal Reviews (incl. Archief):</strong> `;
        let sortedStats = Object.keys(appData.stats).sort((a,b) => appData.stats[b] - appData.stats[a]);
        
        sortedStats.forEach(r => {
            if(appData.stats[r] > 0 && (!revFilter || revFilter === r)) {
                const tagColor = stringToColor(r);
                statsHtml += `<span class="tag" style="margin-left: 10px; background-color: ${tagColor};"><img src="meeple.png" class="meeple-icon" style="width:10px; height:10px;" onerror="this.style.display='none'"> ${r}: ${appData.stats[r]}</span> `;
            }
        });
        document.getElementById('statsBar').innerHTML = statsHtml;
    }

    function updateCounts(counts) {
        for(let id in counts) {
            const el = document.getElementById(`count-${id}`);
            if(el) el.innerText = counts[id];
        }
    }

    function editGame(id) {
        const game = appData.games.find(g => g.id === id);
        if(!game) return;
        
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Spel Bewerken';
        document.getElementById('gId').value = game.id;
        document.getElementById('gTitel').value = game.titel;
        document.getElementById('gUitgever').value = game.uitgever;
        document.getElementById('gStatus').value = game.status;
        document.getElementById('gReviewer').value = game.reviewer;
        document.getElementById('gDeadline').value = formatForDateInput(game.deadline); // DATUM BUG FIX
        populateEpisodeDropdown(game.afleveringNr);
        document.getElementById('gVerwacht').value = game.verwacht;
        document.getElementById('gTekst').value = game.tekstStatus || "";
        document.getElementById('gBgg').value = game.bggLink;
        
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function openModal() {
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-square-plus"></i> Nieuw Spel';
        document.getElementById('gId').value = "";
        document.getElementById('gTitel').value = "";
        document.getElementById('gUitgever').value = "";
        document.getElementById('gStatus').value = "Aangeboden";
        document.getElementById('gReviewer').value = "";
        document.getElementById('gDeadline').value = "";
        populateEpisodeDropdown("");
        document.getElementById('gVerwacht').value = "";
        document.getElementById('gTekst').value = "";
        document.getElementById('gBgg').value = "";
        
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('gTitel').focus();
    }

    function saveAndClose() {
        const titel = document.getElementById('gTitel').value.trim();
        if(!titel && !document.getElementById('gId').value) { 
            document.getElementById('modal-overlay').style.display = 'none';
            return; 
        }
        if(!titel) { alert("Titel mag niet leeg zijn!"); return; }

        const game = {
            id: document.getElementById('gId').value,
            titel: titel,
            uitgever: document.getElementById('gUitgever').value,
            status: document.getElementById('gStatus').value,
            reviewer: document.getElementById('gReviewer').value,
            deadline: document.getElementById('gDeadline').value,
            verwacht: document.getElementById('gVerwacht').value,
            afleveringNr: document.getElementById('gAflevering').value,
            tekstStatus: document.getElementById('gTekst').value,
            bggLink: document.getElementById('gBgg').value
        };

        document.getElementById('modal-overlay').style.display = 'none';
        
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
        
        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveGame', token: localStorage.getItem('sot_token'), game: game })
        }).then(res => res.json()).then(data => {
            if(data.success) fetchData(); 
        });
    }

    function autoFetchBGG() {
        const titel = document.getElementById('gTitel').value;
        if(!titel) { alert("Vul eerst een titel in."); return; }
        
        const btn = document.querySelector('.fa-magnifying-glass').parentElement;
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Zoeken...';
        btn.disabled = true;
        
        fetch(GAS_URL + "?action=fetchBGG&titel=" + encodeURIComponent(titel) + "&token=" + localStorage.getItem('sot_token'))
            .then(res => res.json())
            .then(data => {
                if(data.link) {
                    document.getElementById('gBgg').value = data.link;
                    const input = document.getElementById('gBgg');
                    input.style.backgroundColor = '#064e3b';
                    setTimeout(() => input.style.backgroundColor = '#333', 1000);
                } else alert("Er is iets misgegaan met de BGG verbinding.");
            })
            .catch(err => alert("Fout bij zoeken op BGG."))
            .finally(() => { btn.innerHTML = originalContent; btn.disabled = false; });
    }
</script>
</body>
</html>
